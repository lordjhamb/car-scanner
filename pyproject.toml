[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carscan"
version = "0.1.0"
description = "Universal OBD-II / UDS car diagnostics: every module, guided tests, mileage verification, photo inspection and an AI assistant."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyserial>=3.5",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "anthropic>=2.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
carscan = "carscan.app:main"
car-scanner = "carscan.desktop:main"

[tool.setuptools.packages.find]
include = ["carscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["carscan"]
omit = ["carscan/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "S608", "B008", "SIM105", "SIM102", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]
